[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "MCP server exposing the Pet Hospital REST API (MVP: list_pets), protocol 2026-07-28"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "httpx2>=2.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
petmcp = "petmcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
