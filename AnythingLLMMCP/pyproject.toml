[project]
name = "anythingllm-mcp"
version = "0.1.0"
description = "MCP server (protocol 2026-07-28) that answers questions from a single AnythingLLM workspace."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2.0",
    "httpx>=0.27",
]

[project.scripts]
anythingllm-mcp = "anythingllm_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anythingllm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
